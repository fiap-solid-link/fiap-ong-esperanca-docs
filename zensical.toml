[project]

site_name = "Conexão Solidária"

site_description = "Documentação da plataforma Conexão Solidária — Hackathon 9NETT FIAP | ONG Esperança Solidária"

site_author = "Equipe Hackathon 9NETT"

nav = [
  { "Home" = "index.md" },
  { "Contexto do Projeto" = "contexto.md" },
  { "Modelagem de Domínio" = [
    "modelagem/index.md",
    "modelagem/event-storming.md",
    "modelagem/domain-storytelling.md",
  ]},
  { "Arquitetura" = [
    "arquitetura/index.md",
    { "Microsserviços" = [
      "arquitetura/microsservicos.md",
      "arquitetura/microsservicos/fiap-ong-esperanca-gateway-api.md",
      "arquitetura/microsservicos/fiap-ong-esperanca-identity-api.md",
      "arquitetura/microsservicos/fiap-ong-esperanca-campanhas-api.md",
      "arquitetura/microsservicos/fiap-ong-esperanca-worker.md",
    ]},
    { "Decisões Arquiteturais" = [
      "arquitetura/decisoes-arquiteturais/index.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-01-stack.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-02-microsservicos.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-03-arquitetura-interna.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-04-persistencia.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-05-mensageria.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-06-autenticacao.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-07-api-gateway.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-08-observabilidade.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-09-infraestrutura.md",
      "arquitetura/decisoes-arquiteturais/registros/adr-10-testes.md",
    ]},
  ]},
  { "Execução" = [
    "execucao/index.md",
    "execucao/tarefas.md",
  ]},
]

[project.theme]

language = "pt-BR"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
